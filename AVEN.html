n{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel);color:var(--text);font-weight:700;font-size:12px}.btn.primary{background:var(--accent);color:#071019;border-color:transparent}.btn.danger{color:var(--danger)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#0a121d;color:var(--muted);border-radius:9px;padding:8px 11px;font-size:12px}.tabs button.active{color:var(--text);border-color:var(--accent);background:#142b3a}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}.weekday{text-align:center;color:var(--muted);font-size:10px}.day{min-width:0;min-height:55px;background:#09121d;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:5px;text-align:left}.day.selected{border-color:var(--accent);background:#142a3a}.day.disabled{opacity:.2;cursor:default}.day .num{font-weight:850}.day small{display:block;color:var(--accent);font-size:9px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;min-width:0;background:#080f18;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}.field textarea{min-height:75px}.bar{height:7px;background:#27364a;border-radius:99px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet))}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;background:#09121c;padding:10px}.item small{display:block;color:var(--muted)}.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted)}.badge{border:1px solid var(--line);border-radius:99px;padding:4px 8px;font-size:11px;col <script>
(()=>{'use strict';const START=new Date(2026,9,19,12),END=new Date(2027,1,28,12),DAYS=133,KEY='conquerors_codex_winter_arc_v1';const months=['October','November','December','January','February'],monthIds=[9,10,11,0,1],pages=[['dashboard','Dashboard','◈'],['explore','Explore AVEN','⌂'],['map','Campaign Map','⌖'],['auth','Sign In / Join','↗'],['daily','Daily Log','▦'],['core','Core Workout','✦'],['run','Run Tracker','➤'],['goals','Goals & Quests','⚑'],['skills','Skill Tree','⌘'],['achievements','Achievements','✧'],['stats','Statistics','▥'],['settings','Settings','⚙']];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,date=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)},at=n=>new Date(START.getFullYear(),START.getMonth(),START.getDate()+n,12),dn=s=>Math.round((date(s)-START)/86400000)+1,valid=s=>dn(s)>=1&&dn(s)<=DAYS,fmt=(s,o={month:'short',day:'numeric',year:'numeric'})=>date(s).toLocaleDateString('en-IN',o),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state, page='explore', selected=iso(START),mi=0,runTab='log',statTab='overview',settingTab='appearance';function defaults(){return {profile:{name:'Warrior',theme:'midnight',auto:true,glow:20,spacing:'normal'},records:{},goals:[],quests:[],skills:[],spent:0}}function load(){try{return {...defaults(),...JSON.parse(localStorage.getItem(KEY)),profile:{...defaults().profile,...(JSON.parse(localStorage.getItem(KEY))||{}).profile}}}catch(e){return defaults()}}state=load();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2200)}function blank(){return {pushups:0,pullups:0,gym:0,steps:0,study:0,subject:'',notes:'',runDistance:0,runMinutes:0,runs:[],core:[],exercises:[]}}function rec(s=selected){if(!state.records[s])state.records[s]=blank();return state.records[s]}function exp(r){let detailed=[...(r.core||[]),...(r.exercises||[])].reduce((a,x)=>a+Math.max(0,Number(x.exp)||0),0);let muscle=detailed?detailed:Math.floor((+r.gym||0)/15)*50;muscle+=Math.min(150,(+r.pushups||0)+3*(+r.pullups||0));let endurance=Math.round((+r.runDistance||0)*50),knowledge=Math.floor((+r.study||0)/15)*25;return {muscle,endurance,knowledge,total:muscle+endurance+knowledge}}function all(){return Object.entries(state.records).filter(([d])=>valid(d)).sort((a,b)=>a[0].localeCompare(b[0]))}function totals(){let t={muscle:0,endurance:0,knowledge:0,total:0,study:0,run:0,gym:0,steps:0,pushups:0,pullups:0,active:0};all().forEach(([d,r])=>{let e=exp(r);t.muscle+=e.muscle;t.endurance+=e.endurance;t.knowledge+=e.knowledge;t.total+=e.total;t.study+=+r.study||0;t.run+=+r.runDistance||0;t.gym+=+r.gym||0;t.steps+=+r.steps||0;t.pushups+=+r.pushups||0;t.pullups+=+r.pullups||0;if(e.total>0)t.active++});return t}function threshold(l){return l<=1?0:Math.round(300*Math.pow(l-1,1.48))}function level(x){let l=1;while(l<10000&&threshold(l+1)<=x)l++;return l}function dailyLevel(x){let a=[0,100,250,450,700,1000,1350,1750,2200,2700],l=1;for(let i=1;i<a.length;i++)if(x>=a[i])l=i+1;return l}function spEarn(){return Math.floor((level(totals().total)-1)/2)}function accent(){if(!state.profile.auto)return ({midnight:'#57d7ff',phantom:'#b89cff',ember:'#ff8c69',ascendant:'#ffc86b',custom:state.profile.custom||'#57d7ff'})[state.profile.theme]||'#57d7ff';let l=level(totals().total);return l>=30?'#ffc86b':l>=15?'#b89cff':l>=7?'#57d7ff':'#6ee7ad'}function theme(){document.documentElement.style.setProperty('--accent',accent());document.documentElement.style.setProperty('--glow',(state.profile.glow||20)/100)}function nav(){let items=pages.map(([id,label,icon])=>`<button data-page="${id}" class="${page===id?'active':''}">${icon} &nbsp; ${label}</button>`).join('');$('#nav').innerHTML=items;$('#mnav').innerHTML=[['dashboard','Home','◈'],['daily','Daily Log','▦'],['run','Run Tracker','➤'],['core','Core Workout','✦'],['more','More','⋯']].map(([id,label,icon])=>`<button data-page="${id}" class="${page===id?'active':''}">${icon}<br>${label==='Dashboard'?'Home':label}</button>`).join('');$$('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();if(typeof closeMenu==='function')closeMenu()})}function card(label,val,sub){return `<div class="card"><div class="label">${label}</div><div class="metric">${val}</div><div class="label">${sub||''}</div></div>`}function calendar(){let m=monthIds[mi],year=mi===0?2026:mi<=2?2026:2027,first=new Date(year,m,1,12),days=new Date(year,m+1,0,12).getDate(),h=`<div class="tabs">${months.map((x,i)=>`<button data-month="${i}" class="${mi===i?'active':''}">${x}</button>`).join('')}</div><div class="calendar">`;['M','T','W','T','F','S','S'].forEach(x=>h+=`<div class="weekday">${x}</div>`);let off=(first.getDay()+6)%7;for(let i=0;i<off;i++)h+='<button class="day disabled"></button>';for(let n=1;n<=days;n++){let s=iso(new Date(year,m,n,12)),ok=valid(s),r=state.records[s],e=r?exp(r):{total:0};h+=`<button class="day ${s===selected?'selected':''} ${ok?'':'disabled'}" ${ok?`data-date="${s}" `:'disabled'}><span class="num">${n}</span><small>${ok&&e.total?'L'+dailyLevel(e.total):''}</small></button>`}return h+'</div>'}function bindCal(){$$('[data-month]').forEach(b=>b.onclick=()=>{mi=+b.dataset.month;render()});$$('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;page='daily';render()})}function setHead(){let names={explore:['Explore AVEN','Your goals. Your progress. Your next chapter.'],map:['Campaign Map','Travel through the five regions of your Winter Arc.'],auth:['Welcome to AVEN','Set up your profile and keep your progress organised.'],more:['More','Your tools, settings, and campaign pages.'],dashboard:['Dashboard','Your campaign overview. Keep showing up.'],daily:['Daily Log','Choose a date and record the work.'],core:['Core Workout','Record core sessions and completed sets.'],run:['Run Tracker','Log distance and time; pace calculates automatically.'],goals:['Goals & Quests','Set targets, then track your progress.'],skills:['Skill Tree','Spend Skill Points on tracker unlocks.'],achievements:['Achievements','Milestones earned through saved records.'],stats:['Statistics','A clear picture of your actual campaign.'],settings:['Settings','Customize AVEN and protect your progress.']};$('#title').textContent=names[page][0];$('#subtitle').textContent=names[page][1];$('#daybadge').textContent=`DAY ${Math.min(DAYS,Math.max(1,dn(selected)))} / ${DAYS}`}function render(){theme();nav();setHead();({explore:explore,map:campaignMap,auth:authPage,more:morePage,dashboard:dashboard,daily:daily,core:core,run:run,goals:goals,skills:skills,achievements:achievements,stats:stats,settings:settings}[page]||dashboard)()}function dashboard(){let t=totals(),l=level(t.total),r=rec(),e=exp(r),next=threshold(l+1),cur=threshold(l),p=(t.total-cur)/(next-cur)*100;$('#view').innerHTML=`<div class="card"><div class="row spread"><div><div class="eyebrow">Your profile</div><h2>${esc(state.profile.name||'Warrior')}</h2><div class="label">Overall Level ${l} · ${t.total.toLocaleString()} total EXP</div></div><div class="metric">${spEarn()-state.spent} SP</div></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,p))}%"></span></div><div class="label" style="margin-top:6px">${Math.max(0,next-t.total).toLocaleString()} EXP to Level ${l+1}</div></div><div class="grid four section">${card('TOTAL EXP',t.total.toLocaleString(),'All saved days')}${card('MUSCLE EXP',t.muscle.toLocaleString(),'Strength + core')}${card('ENDURANCE EXP',t.endurance.toLocaleString(),'Running')}${card('KNOWLEDGE EXP',t.knowledge.toLocaleString(),'Study')}</div><div class="grid two section"><div class="card"><div class="row spread"><h2>Campaign calendar</h2><span class="badge">133 days</span></div><p class="label">Day 1 is October 19. Final day is February 28.</p>${calendar()}</div><div class="grid"><div class="card"><h2>Selected day · ${fmt(selected,{month:'short',day:'numeric'})}</h2><div class="metric">Level ${dailyLevel(e.total)}</div><div class="label">${e.total} EXP today</div><div class="bar"><span style="width:${Math.min(100,e.total/2700*100)}%"></span></div><div class="section row spread"><span class="label">Muscle</span><b>${e.muscle}</b></div><div class="row spread"><span class="label">Endurance</span><b>${e.endurance}</b></div><div class="row spread"><span class="label">Knowledge</span><b>${e.knowledge}</b></div><button class="btn primary section" id="openLog">Open daily log →</button></div><div class="card"><h2>Campaign totals</h2><div class="row spread"><span class="label">Study time</span><b>${(t.study/60).toFixed(1)} h</b></div><div class="row spread"><span class="label">Run distance</span><b>${t.run.toFixed(2)} km</b></div><div class="row spread"><span class="label">Gym time</span><b>${(t.gym/60).toFixed(1)} h</b></div><div class="row spread"><span class="label">Steps</span><b>${t.steps.toLocaleString()}</b></div></div></div></div><div class="card section"><div class="row spread"><h2>Active quests</h2><button class="btn" id="questPage">View quests</button></div>${questList()}</div><p class="fine section">Saved in this browser only. Export a backup from Settings before clearing browser data.</p>`;bindCal();$('#openLog').onclick=()=>{page='daily';render()};$('#questPage').onclick=()=>{page='goals';render()};$$('[data-complete]').forEach(b=>b.onclick=()=>completeQuest(+b.dataset.complete))}
function field(label,id,value,type='number',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value??'')}" ${type==='number'?'min="0" step="any"':''} ${extra}></div>`}function daily(){let r=rec(),e=exp(r);$('#view').innerHTML=`<div class="grid two"><div class="card"><h2>Choose date</h2>${calendar()}<div class="row spread section"><button class="btn" id="prev">← Previous</button><button class="btn" id="start">Campaign start</button><button class="btn" id="next">Next →</button></div></div><div class="card"><div class="row spread"><h2>Daily entry</h2><span class="badge">Day ${dn(selected)} / 133</span></div><form id="dailyForm"><div class="form section">${field('Push-ups (reps)','pushups',r.pushups)}${field('Pull-ups (reps)','pullups',r.pullups)}${field('Gym duration (minutes)','gym',r.gym)}${field('Steps','steps',r.steps)}${field('Study duration (minutes)','study',r.study)}${field('Study subject','subject',r.subject,'text') }<div class="field full"><label for="notes">Notes / reflection</label><textarea id="notes">${esc(r.notes)}</textarea></div></div><div class="row section"><button class="btn primary">Save day</button><button class="btn danger" type="button" id="clear">Clear day</button></div></form><div class="grid four section">${card('TOTAL EXP',e.total,'Today')}${card('DAILY LEVEL',dailyLevel(e.total)+'/10','Today only')}${card('OVERALL LEVEL',level(totals().total),'Campaign')}${card('MUSCLE EXP',e.muscle,'Today')}</div><p class="fine section">Study: 25 EXP per 15 min. Running: 50 EXP/km. Push-ups: 1 EXP each; pull-ups: 3 EXP each (combined cap 150/day). Gym: 50 EXP per 15 min when no detailed exercise entries exist.</p></div></div>`;bindCal();$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);$('#start').onclick=()=>{selected=iso(START);render()};$('#dailyForm').onsubmit=e=>{e.preventDefault();r=rec();['pushups','pullups','gym','steps','study'].forEach(k=>r[k]=Math.max(0,+$('#'+k). riations — 35 EXP per set.\n\nKeep entries honest; each entry is capped at 150 EXP.');$$('[data-delcore]').forEach(b=>b.onclick=()=>{rec().core.splice(+b.dataset.delcore,1);save();render()})}
function pace(v){let s=Math.round(v*60);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}function run(){let r=rec();$('#view').innerHTML=`<div class="card"><div class="tabs"><button data-runtab="log" class="${runTab==='log'?'active':''}">Log run</button><button data-runtab="pace" class="${runTab==='pace'?'active':''}">Pace calculator</button><button data-runtab="history" class="${runTab==='history'?'active':''}">Run history</button></div><div id="runbody">${runTab==='log'?`<div class="grid two"><div><h2>Record a run</h2><form id="runForm" class="form">${field('Distance (km)','rdist','')}${field('Time (minutes)','rmins','')}<div class="field full"><button class="btn primary">Save run</button></div></form></div><div class="card"><div class="metric">${(+r.runDistance||0).toFixed(2)} km</div><div class="label">Selected day distance</div><div class="row spread section"><span class="label">Total run time</span><b>${Math.round(+r.runMinutes||0)} min</b></div>${(r.runs||[]).map(x=>`<div class="item section"><div><b>${x.distance.toFixed(2)} km</b><small>${x.minutes} min · ${pace(x.minutes/x.distance)}/km</small></div></div>`).join('')}</div></div>`:runTab==='pace'?`<div class="grid two"><div class="form">${field('Distance (km)','pdistance',5)}${field('Minutes','pminutes',30)}${field('Extra seconds','pseconds',0)}</div><div class="card"><div class="label">Average pace</div><div class="metric" id="presult">6:00 / km</div><div class="label" id="pspeed">10.00 km/h</div></div></div>`:runHistory() }</div></div>`;$$('[data-runtab]').forEach(b=>b.onclick=()=>{runTab=b.dataset.runtab;render()});if(runTab==='log')$('#runForm').onsubmit=e=>{e.preventDefault();let d=Math.max(0,+$('#rdist').value||0),m=Math.max(0,+$('#rmins').value||0);if(!d||!m)return toast('Enter distance and time greater than zero');r.runs.push({distance:d,minutes:m});r.runDistance=(+r.runDistance||0)+d;r.runMinutes=(+r.runMinutes||0)+m;save();render();toast('Run saved')};if(runTab==='pace'){let upd=()=>{let d=+$('#pdistance').value,m=(+$('#pminutes').value||0)+(+$('#pseconds').value||0)/60;$('#presult').textContent=d>0&&m>0?pace(m/d)+' / km':'—';$('#pspeed').textContent=d>0&&m>0?(d/(m/60)).toFixed(2)+' km/h':'Enter valid values'};['pdistance','pminutes','pseconds'].forEach(id=>$('#'+id).oninput=upd)}$$('[data-delrun]').forEach(b=>b.onclick=()=>{let i=+b.dataset.delrun,x=rec().runs.splice(i,1)[0];rec().runDistance=Math.max(0,(+rec().runDistance||0)-x.distance);rec().runMinutes=Math.max(0,(+rec().runMinutes||0)-x.minutes);save();render()})}function runHistory(){let a=all().flatMap(([d,r])=>(r.runs||[]).map((x,i)=>({...x,d,i}))).reverse();return a.length?`<div class="list">${a.map(x=>`<div class="item"><div><b>${fmt(x.d)} · ${x.distance.toFixed(2)} km</b><small>${x.minutes} min · ${pace(x.minutes/x.distance)}/km</small></div><button class="btn danger" data-delrun="${x.i}" data-date="${x.d}">Remove</button></div>`).join('')}</div>`:'<div class="empty">No runs recorded yet.</div>'}
function goals(){let gh=state.goals.length?`<div class="list">${state.goals.map(g=>`<div class="item"><div style="flex:1"><b>${esc(g.title)}</b><small>${esc(g.category)} · ${g.progress}/${g.target} ${esc(g.unit)} · due ${esc(g.deadline||'no deadline')}</small><div class="bar"><span style="width:${Math.min(100,g.progress/g.target*100)}%"></span></div></div><button class="btn" data-goalprogress="${g.id}">+ progress</button><button class="btn danger" data-goaldel="${g.id}">×</button></div>`).join('')}</div>`:'<div class="empty">No goals yet.</div>';$('#view').innerHTML=`<div class="grid two"><div class="card"><h2>Create a goal</h2><form id="goalForm" class="form">${field('Goal title','gtitle','','text','required')}<div class="field"><label for="gcat">Category</label><select id="gcat"><option>Fitness</option><option>Running</option><option>Study</option><option>Personal</option></select></div>${field('Target','gtarget',1)}${field('Current progress','gprogress',0)}${field('Unit','gunit','sessions','text')}<div class="field"><label for="gdeadline">Deadline</label><input id="gdeadline" type="date" min="${iso(START)}" max="${iso(END)}"></div><div class="field full"><button class="btn primary">Add goal</button></div></form><p class="fine">Goal milestones do not grant duplicate EXP, avoiding double-counting the same activity.</p></div><div class="card"><h2>Long-term goals</h2>${gh}</div></div><div class="card section"><h2>Create a daily quest</h2><form id="questForm" class="form">${field('Quest title','qtitle','','text','required')}<div class="field"><label for="qcat">Category</label><select id="qcat"><option>Fitness</option><option>Running</option><option>Study</option><option>Personal</option></select></div><div class="field"><label for="qreward">Difficulty</label><select id="qreward"><option value="50">Small · 50 EXP estimate</option><option value="100">Standard · 100 EXP estimate</option><option value="200">Major · 200 EXP estimate</option></select></div><div class="field  const t=totals(),arr=all(),recordMap=state.records;

 const c=cfg[statTab]||cfg.overview;
 const selectedDay=Math.max(1,Math.min(DAYS,Number(window.avenStatDay)||1));

 if(seg.length)paths.push(seg);

 const data=statTab==='overview'?`<div class="grid four">${card('TOTAL EXP',t.total,'Campaign')}${card('STUDY HOURS',(t.study/60).toFixed(1),'Campaign')}${card('RUN DISTANCE',t.run.toFixed(2)+' km','Campaign')}${card('ACTIVE DAYS',t.active,'Campaign')}</div>`:statTab==='strength'?`<div class="grid four">${card('MUSCLE EXP',t.muscle,'Campaign')}${card('PUSH-UPS',t.pushups,'Total reps')}${card('PULL-UPS',t.pullups,'Total reps')}${card('GYM HOURS',(t.gym/60).toFixed(1),'Logged duration')}</div>`:statTab==='running'?`<div class="grid four">${card('DISTANCE',t.run.toFixed(2)+' km','Campaign')}${card('ENDURANCE EXP',t.endurance,'Campaign')}${card('RUNS',arr.reduce((a,[d,r])=>a+(r.runs||[]).length,0),'Sessions')}${card('STEPS',t.steps.toLocaleString(),'Campaign')}</div>${runHistory()}`:`<div class="grid four">${card('KNOWLEDGE EXP',t.knowledge,'Campaign')}${card('STUDY HOURS',(t.study/60).toFixed(1),'Campaign')}${card('STUDY DAYS',arr.filter(([d,r])=>r.study>0).length,'Logged days')}${card('GOALS COMPLETED',state.goals.filter(g=>g.progress>=g.target).length,'Goals')}</div>`;
 $('#view').innerHTML=`<div class="card"><div class="row spread"><div class="tabs">${tabs.map(([k,v])=>`<button data-stat="${k}" class="${statTab===k?'active':''}">${v}</button>`).join('')}</div><span class="badge">Full campaign · 133 days</span></div><p class="fine">Statistics use saved entries only. Unlogged days appear as gaps, not invented values.</p></div>${data}
 <div class="card section"><div class="row spread"><div><h2>${c.label} · Daily trend</h2><p class="fine">Select a day to inspect its saved value.</p></div><span class="badge">Day ${selectedDay} / ${DAYS}</span></div>

 <div class="section" style="margin-top:12px"><label for="avenDaySlider">Campaign day</label><input id="avenDaySlider" type="range" min="1" max="${DAYS}" step="1" value="${selectedDay}" style="width:100%;accent-color:var(--accent)"/><div class="row spread fine"><span>Day 1 · 19 OCT</span><span>Day 133 · 28 FEB</span></div></div>

 const regions=[['The Awakening','19–31 OCT','Days 1–13','Begin the journey and establish your routine.'],['The Forge','NOVEMBER','Days 14–43','Build consistency through repeatable effort.'],['The Crucible','DECEMBER','Days 44–74','Review your habits and keep showing up.'],['The Ascension','JANUARY','Days 75–105','Use your real stats to guide the next step.'],['The Conqueror','FEBRUARY','Days 106–133','Complete the campaign and review your progress.']];
 const pts=[[95,265],[220,205],[340,250],[455,150],[565,72]];
 const nodes=regions.map((r,i)=>`<g class="map-node" tabindex="0" role="button" aria-label="${r[0]}" data-region="${i}"><path d="M${pts[i][0]-17} ${pts[i][1]+10} L${pts[i][0]-17} ${pts[i][1]-27} Q${pts[i][0]} ${pts[i][1]-48} ${pts[i][0]+17} ${pts[i][1]-27} L${pts[i][0]+17} ${pts[i][1]+10}" fill="#111c17" stroke="#8eaa96" stroke-width="1.5"/><path d="M${pts[i][0]-22} ${pts[i][1]+10} H${pts[i][0]+22}" stroke="#d7b76b" stroke-width="2"/><circle cx="${pts[i][0]}" cy="${pts[i][1]-27}" r="4" fill="#70ff9b"/><text x="${pts[i][0]}" y="${pts[i][1]+28}" class="map-label" text-anchor="middle">${r[0]}</text><text x="${pts[i][0]}" y="${pts[i][1]+43}" class="map-sub" text-anchor="middle">${r[1]}</text></g>`).join('');
 $('#view').innerHTML=`<div class="card"><div class="row spread"><div><h2>Winter Arc · Five chapters</h2><p class="muted">19 October 2026 — 28 February 2027 · 133 days</p></div><span class="badge">AVEN CAMPAIGN</span></div><p class="fine">Choose a landmark to view its chapter. This is a symbolic progress path, not a geographic map.</p><div class="region-map section"><svg viewBox="0 0 650 350" role="img" aria-label="A winding road through five campaign pillars" style="width:100%;height:auto;display:block"><defs><pattern id="quietGrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8cb7a1" stroke-opacity=".07"/></pattern></defs><rect width="650" height="350" rx="12" fill="url(#quietGrid)"/><path d="M40 300 C100 290 70 230 145 240 S195 165 265 190 S315 285 380 235 S410 130 480 135 S525 75 610 40" fill="none" stroke="#263b31" stroke-width="28" stroke-linecap="round"/><path d="M40 300 C100 290 70 230 145 240 S195 165 265 190 S315 285 380 235 S410 130 480 135 S525 75 610 40" fill="none" stroke="#d7b76b" stroke-width="2" stroke-dasharray="5 10" stroke-linecap="round" opacity=".85"/>${nodes}<text x="22" y="25" class="map-sub">AVEN · THE WINTER ARC</text><text x="22" y="333" class="map-sub">YOUR PACE. YOUR PROGRESS.</text></svg></div><div id="regionDetail" class="card section"><h2>Choose a chapter</h2><p class="muted">Five milestones mark the journey from the first day to the finish.</p></div></div>`;
 $$('[data-region]').forEach(b=>{const open=()=>{const i=+b.dataset.region,r=regions[i];$('#regionDetail').innerHTML=`<div class="eyebrow">CHAPTER ${String(i+1).padStart(2,'0')}</div><h2>${r[0]}</h2><p class="label">${r[1]} · ${r[2]}</p><p class="muted">${r[3]}</p><button class="btn primary" id="regionLog">Open this chapter →</button>`;$('#regionLog').onclick=()=>{selected=iso(at([0,13,43,74,105][i]));page='daily';render()}};b.onclick=open;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});
}
function authPage(){
 $('#view').innerHTML=`<div class="auth-wrap"><div class="card"><div class="auth-brand">AVEN</div><p class="muted">Your life. Your goals. Your progress.</p><div class="tabs"><button class="active" data-authmode="signin">Sign In</button><button data-authmode="signup">Create Account</button></div><div id="authForm"></div><div class="auth-note section"><b>Not connected yet:</b> This page is currently a front-end preview. It does not create secure accounts or sync data yet. We must connect Firebase Authentication and Firestore and configure security rules before real users register.</div></div></div>`;
 let mode='signin';const paint=()=>{$$('.tabs [data-authmode]').forEach(b=>b.classList.toggle('active',b.dataset.authmode===mode));$('#authForm').innerHTML=mode==='signin'?`<form id="signForm" class="form section"><div class="field full"><label>Email</label><input type="email" id="authEmail" required placeholder="you@example.com"></div><div class="field full"><label>Password</label><input type="password" id="authPass" required minlength="8" placeholder="At least 8 characters"></div><div class="field full"><button class="btn primary">Sign In</button></div><p class="fine field full">Google sign-in and password recovery will be enabled when the secure auth backend is connected.</p></form>`:`<form id="signForm" class="form section"><div class="field full"><label>Display name</label><input id="authName" required maxlength="32" placeholder="What should AVEN call you?"></div><div class="field full"><label>Email</label><input type="email" id="authEmail" required placeholder="you@example.com"></div><div class="field full"><label>Password</label><input type="password" id="authPass" required minlength="8" placeholder="At least 8 characters"></div><div class="field full"><button class="btn primary">Create Account</button></div></form>`;$('#signForm').onsubmit=e=>{e.preventDefault();toast('Preview only — secure accounts are not connected yet') }};$$('[data-authmode]').forEach(b=>b.onclick=()=>{mode=b.dataset.authmode;paint()});paint();
}
function morePage(){
 const links=[['map','Campaign Map','Explore the five campaign regions.'],['explore','Explore AVEN','Return to the welcome page.'],['goals','Goals & Quests','Your objectives and quests.'],['skills','Skill Tree','Unlock progression branches.'],['achievements','Achievements','Review milestones.'],['stats','Statistics','Inspect your daily trends.'],['settings','Settings','Appearance, profile, and backups.'],['auth','Sign In / Create Account','Account options (cloud setup pending).']];
 $('#view').innerHTML=`<div class="grid two">${links.map(x=>`<button class="card item" style="text-align:left;color:var(--text)" data-more="${x[0]}"><div><b>${x[1]}</b><small>${x[2]}</small></div><span>→</span></button>`).join('')}</div><div class="credit">THE CONQUEROR’S CODEX<span style="display:block;margin-top:8px">Designed &amp; Created by</span><b>Aditya Yug</b></div>`;
 $$('[data-more]').forEach(b=>b.onclick=()=>{page=b.dataset.more;render()});
}

function settings(){let content=settingTab==='appearance'?`<h2>Appearance</h2><div class="form section"><div class="field"><label for="theme">Theme preset</label><select id="theme"><option value="midnight">Midnight · Cyan</option><option value="phantom">Phantom · Violet</option><option value="ember">Ember · Red-orange</option><option value="ascendant">Ascendant · Gold</option><option value="custom">Custom accent</option></select></div><div class="field"><label for="custom">Custom accent</label><input type="color" id="custom" value="${state.profile.custom||'#57d7ff'}"></div><div class="field"><label><input id="auto" type="checkbox" ${state.profile.auto?'checked':''}> Automatic colour by level</label></div><div class="field"><label for="glow">Glow intensity</label><input id="glow" type="range" min="0" max="60" value="${state.profile.glow}"></div></div>`:settingTab==='profile'?`<h2>Your profile</h2><form id="profileForm" class="form section">${field('Display name','pname',state.profile.name,'text','maxlength="32" required')}<div class="field"><label>Campaign dates</label><input disabled value="19 Oct 2026 – 28 Feb 2027"></div><div class="field full"><button class="btn primary">Save profile</button></div></form>`:settingTab==='data'?`<h2>Data & backup</h2><p class="muted">Your progress is saved in this browser only; it does not sync to another device or friend. Export backups occasionally.</p><div class="row section"><button class="btn primary" id="export">Export JSON backup</button><label class="btn" for="import">Import JSON backup</label><input class="hidden" type="file" id="import" accept="application/json,.json"><button class="btn danger" id="reset">Reset all data</button></div><div class="section"><h3>Publish your site</h3><p class="fine">Upload index.html to Netlify or GitHub Pages. Each visitor has their own local browser save; no accounts or leaderboard are included.</p></div>`:`<h2>EXP rules</h2><div class="list section">${[['Study','25 EXP per 15 minutes'],['Running','50 EXP per kilometre; pace adds no EXP'],['Push-ups / pull-ups','1 EXP per push-up, 3 per pull-up; combined daily cap 150'],['Gym duration','50 EXP per 15 minutes if no detailed core entries exist'],['Daily level','Level 1–10 based on that day’s EXP'],['Overall level','Scalable curve: 300 × (level − 1)^1.48 EXP threshold']].map(x=>`<div class="item"><div><b>${x[0]}</b><small>${x[1]}</small></div></div>`).join('')}</div>`;$('#view').innerHTML=`<div class="card"><div class="tabs">${[['appearance','Appearance'],['profile','Profile'],['data','Data & Backup'],['rules','EXP rules']].map(([k,v])=>`<button data-stab="${k}" class="${settingTab===k?'active':''}">${v}</button>`).join('')}</div><div class="divider"></div>${content}</div><div class="credit">THE CONQUEROR’S CODEX<span style="display:block;margin-top:8px">Designed &amp; Created by</span><b>Aditya Yug</b></div>`;$$('[data-stab]').forEach(b=>b.onclick=()=>{settingTab=b.dataset.stab;render()});if(settingTab==='appearance'){ $('#theme').value=state.profile.theme;$('#theme').onchange=()=>{state.profile.theme=$('#theme').value;save();render()};$('#custom').onchange=()=>{state.profile.custom=$('#custom').value;state.profile.theme='custom';save();render()};$('#auto').onchange=()=>{state.profile.auto=$('#auto').checked;save();render()};$('#glow').oninput=()=>{state.profile.glow=+$('#glow').value;document.documentElement.style.setProperty('--glow',state.profile.glow/100)};$('#glow').onchange=()=>save()}if(settingTab==='profile')$('#profileForm').onsubmit=e=>{e.preventDefault();state.profile.name=$('#pname').value.trim()||'Warrior';save();render();toast('Profile saved')};if(settingTab==='data'){$('#export').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='aven-progress-backup.json';a.click();URL.revokeObjectURL(url)};$('#import').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.records)throw Error('Invalid AVEN backup');if(confirm('Replace current data with this backup?')){state={...defaults(),...x};save();render();toast('Backup imported')}}catch(err){alert('Import failed: '+err.message)}};rd.readAsText(f)};$('#reset').onclick=()=>{if(confirm('Clear all AVEN data? Export a backup first if needed.')&&confirm('Final confirmation?')){state=defaults();selected=iso(START);save();render();toast('AVEN reset')}}}}
$('#quick').onclick=()=>{try{save();toast('Progress saved in this browser.')}catch(e){toast('Could not save — check browser storage.')}};
const side=$('.side'),toggle=$('#menuToggle'),scrim=$('#navScrim');function closeMenu(){side.classList.remove('mobile-open');scrim.classList.remove('show');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open navigation')}function openMenu(){side.classList.add('mobile-open');scrim.classList.add('show');toggle.setAttribute('aria-expanded','true');toggle.setAttribute('aria-label','Close navigation')}toggle.onclick=()=>side.classList.contains('mobile-open')?closeMenu():openMenu();scrim.onclick=closeMenu;$$('[data-page]').forEach(b=>b.addEventListener('click',closeMenu));window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
// If the browser storage is unavailable, keep the app usable and report honestly.
const originalSave=save;save=function(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Browser storage is unavailable. Export a backup if possible.');return false}};
render();})();
</script></body></html>
